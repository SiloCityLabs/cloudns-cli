# Push a tag such as v0.1.0 to publish a GitHub release and attach the binaries.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  publish:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release binaries
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          ldflags="-s -w -X github.com/ldrrp/cloudns-cli/internal/cli.version=${version}"
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for target in $targets; do
            goos="${target%/*}"
            goarch="${target#*/}"
            bin="cloudns"
            if [ "$goos" = "windows" ]; then
              bin="cloudns.exe"
            fi
            stage="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" -o "${stage}/${bin}" ./cmd/cloudns
            name="cloudns_${version}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip "${GITHUB_WORKSPACE}/dist/${name}.zip" "$bin")
            else
              tar -C "$stage" -czf "${GITHUB_WORKSPACE}/dist/${name}.tar.gz" "$bin"
            fi
            rm -rf "$stage"
          done
          cd dist
          sha256sum ./*.tar.gz ./*.zip > checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
