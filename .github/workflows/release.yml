# A v* tag starts this workflow. Notes written in the GitHub release form are kept:
# the archives, one Linux .deb, one Linux .apk, and a macOS .pkg are attached.
# A tag pushed without a release gets one.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  archives:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install nfpm
        run: |
          set -eu
          version=2.47.0
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${version}/nfpm_${version}_Linux_x86_64.tar.gz"
          tar -C /tmp -xzf /tmp/nfpm.tar.gz nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
      - name: Build release binaries
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          linux_bins="$(mktemp -d)"
          ldflags="-s -w -X github.com/ldrrp/cloudns-cli/internal/cli.version=${version}"
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for target in $targets; do
            goos="${target%/*}"
            goarch="${target#*/}"
            bin="cloudns"
            if [ "$goos" = "windows" ]; then
              bin="cloudns.exe"
            fi
            stage="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" -o "${stage}/${bin}" ./cmd/cloudns
            name="cloudns_${version}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip "${GITHUB_WORKSPACE}/dist/${name}.zip" "$bin")
            else
              tar -C "$stage" -czf "${GITHUB_WORKSPACE}/dist/${name}.tar.gz" "$bin"
            fi
            if [ "$goos" = "linux" ]; then
              cp "${stage}/${bin}" "${linux_bins}/cloudns-${goarch}"
            fi
            rm -rf "$stage"
          done
          VERSION="$version" \
            AMD64_BIN="${linux_bins}/cloudns-amd64" \
            ARM64_BIN="${linux_bins}/cloudns-arm64" \
            nfpm pkg --config packaging/nfpm.yaml --packager deb \
            --target "${GITHUB_WORKSPACE}/dist/cloudns_${version}_linux_all.deb"
          VERSION="$version" \
            AMD64_BIN="${linux_bins}/cloudns-amd64" \
            ARM64_BIN="${linux_bins}/cloudns-arm64" \
            nfpm pkg --config packaging/nfpm.yaml --packager apk \
            --target "${GITHUB_WORKSPACE}/dist/cloudns_${version}_linux_all.apk"
          rm -rf "$linux_bins"
      - uses: actions/upload-artifact@v6
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the macOS installer
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          ldflags="-s -w -X github.com/ldrrp/cloudns-cli/internal/cli.version=${version}"
          stage="$(mktemp -d)"
          for goarch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" \
              -o "${stage}/cloudns-${goarch}" ./cmd/cloudns
          done
          lipo -create "${stage}/cloudns-amd64" "${stage}/cloudns-arm64" \
            -output "${stage}/cloudns"
          lipo -info "${stage}/cloudns"
          root="$(mktemp -d)"
          mkdir -p "${root}/usr/local/bin"
          cp "${stage}/cloudns" "${root}/usr/local/bin/cloudns"
          chmod 0755 "${root}/usr/local/bin/cloudns"
          pkgbuild \
            --root "$root" \
            --identifier com.silocitylabs.cloudns \
            --version "$version" \
            --install-location / \
            --ownership recommended \
            "dist/cloudns_${version}_darwin_universal.pkg"
          rm -rf "$stage" "$root"
      - uses: actions/upload-artifact@v6
        with:
          name: release-macos-pkg
          path: dist/*.pkg
          if-no-files-found: error

  publish:
    needs: [archives, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -eu
          cd dist
          sha256sum ./*.tar.gz ./*.zip ./*.deb ./*.apk ./*.pkg > checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
