# One Linux package for amd64 and arm64. nfpm maps arch "all" to Debian
# "all" and Alpine "noarch". packaging/cloudns.sh selects the binary.
name: cloudns
arch: all
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: SiloCityLabs
description: Command-line client for the ClouDNS HTTP API
homepage: https://github.com/SiloCityLabs/cloudns-cli
contents:
  - src: ${AMD64_BIN}
    dst: /usr/lib/cloudns/cloudns-amd64
    expand: true
    file_info:
      mode: 0755
  - src: ${ARM64_BIN}
    dst: /usr/lib/cloudns/cloudns-arm64
    expand: true
    file_info:
      mode: 0755
  - src: packaging/cloudns.sh
    dst: /usr/bin/cloudns
    file_info:
      mode: 0755
